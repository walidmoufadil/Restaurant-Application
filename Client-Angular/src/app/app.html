<div class="min-h-screen bg-amber-50">
    <!-- En-tête -->
    <nav *ngIf="shouldShowHeader()" class="bg-orange-400 shadow-md">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <img src="assets/restaurant-icon2.svg" alt="Restaurant Icon" class="h-12 w-12 object-contain"/>
                    <h1 class="text-2xl font-bold text-white">Chez WALID</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <a routerLink="/commandes"
                       routerLinkActive="bg-green-600 text-white"
                       class="px-4 py-2 rounded-lg text-white hover:bg-green-600 transition-colors duration-200">
                        Commandes
                    </a>
                    <a routerLink="/chat"
                       routerLinkActive="bg-green-600 text-white"
                       class="px-4 py-2 rounded-lg text-white hover:bg-green-600 transition-colors duration-200">
                        Assistant
                    </a>
                    <button (click)="logout()"
                            class="px-4 py-2 rounded-lg text-white hover:bg-red-600 transition-colors duration-200 flex items-center space-x-2">
                        <span>Déconnexion</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contenu principal -->
    <main class="container mx-auto px-4 py-8">
        <router-outlet></router-outlet>
    </main>
</div>
